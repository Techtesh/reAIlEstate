{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {{ block.super }}
  <li><form method="post" action="{{ run_reanalysis_cart_url }}">{% csrf_token %}<button type="submit">Run reanalysis cart (20)</button></form></li>
{% endblock %}

{% block search %}
  {{ block.super }}
  <form method="get" style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:8px 0 16px">
    {% for key, value in request.GET.items %}
      {% if key != "page_size" and key != "p" %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}
    {% endfor %}
    <label for="project-page-size"><strong>Projects per page</strong></label>
    <select id="project-page-size" name="page_size">
      <option value="10"{% if project_page_size == "10" %} selected{% endif %}>10</option>
      <option value="20"{% if project_page_size == "20" %} selected{% endif %}>20</option>
      <option value="50"{% if project_page_size == "50" %} selected{% endif %}>50</option>
      <option value="all"{% if project_page_size == "all" %} selected{% endif %}>All</option>
    </select>
    <button type="submit" class="button">Apply</button>
  </form>
{% endblock %}
