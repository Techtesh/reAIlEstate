# Private HTTP preview through an SSH tunnel only; do not start the https service.
x-preview-environment: &preview-environment
  SECURE_SSL_REDIRECT: "false"
  USE_X_FORWARDED_PROTO: "false"
  CSRF_TRUSTED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
  CORS_ALLOWED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080

services:
  admin:
    environment: *preview-environment
  builder:
    environment: *preview-environment
  buyer:
    environment: *preview-environment
