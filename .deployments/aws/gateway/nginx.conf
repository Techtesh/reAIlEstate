map $http_x_forwarded_client_proto $forwarded_proto {
    default $http_x_forwarded_client_proto;
    ""      $scheme;
}

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

upstream admin_service {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream builder_service {
    server 127.0.0.1:8003;
    keepalive 8;
}

upstream buyer_service {
    server 127.0.0.1:8004;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Correlation-ID $correlation_id;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /health/ready {
        access_log off;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_pass http://buyer_service;
    }

    location ^~ /static/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /admin/ {
        proxy_pass http://admin_service;
    }

    location = /api/v1/auth/builder-login {
        proxy_pass http://builder_service;
    }

    location ^~ /api/v1/builder/ {
        proxy_pass http://builder_service;
    }

    location ~ ^/api/v1/developer-organizations/[^/]+/projects/?$ {
        proxy_pass http://builder_service;
    }

    location ^~ /api/v1/developer-projects/ {
        proxy_pass http://builder_service;
    }

    location ^~ /api/v1/ingestion-runs/ {
        proxy_pass http://builder_service;
    }

    location = /builder {
        proxy_pass http://builder_service;
    }

    location ^~ /builder/ {
        proxy_pass http://builder_service;
    }

    location ^~ /api/v1/admin/ {
        proxy_pass http://admin_service;
    }

    location ^~ /api/v1/review/ {
        proxy_pass http://admin_service;
    }

    location ^~ /api/v1/operations/ {
        proxy_pass http://admin_service;
    }

    location = /api/v1/developer-organizations {
        proxy_pass http://admin_service;
    }

    location ^~ /api/v1/developer-organizations/ {
        proxy_pass http://admin_service;
    }

    location / {
        proxy_pass http://buyer_service;
    }
}
